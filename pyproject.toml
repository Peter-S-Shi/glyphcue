[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphcue"
version = "0.1.0"
description = "Local-first difficult-subtitle reconstruction workbench (V1 production skeleton)."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pysubs2>=1.7",
    "av>=11",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"glyphcue.persistence.migrations_sql" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
