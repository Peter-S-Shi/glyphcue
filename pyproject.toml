[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphcue"
version = "0.1.0"
description = "Local-first difficult-subtitle reconstruction workbench (V1 production skeleton)."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pysubs2>=1.7",
    "av>=11",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "Pillow>=10.0",
]
# V1 OCR runtime (see docs/adr/0001-ocr-runtime-selection.md). Not part
# of `dev` or the base dependencies: paddlepaddle alone is ~400MB, so it
# is deliberately excluded from the default CI install. Install with
# `pip install -e ".[ocr]"` to exercise glyphcue.adapters.paddleocr_engine
# and its tests locally.
#
# Pinned exactly (not >=) to the paddleocr/paddlepaddle version pair
# actually installed and re-verified on Windows Python 3.12 for this
# milestone's corrective pass. This pairing matters: paddleocr==3.7.0
# with paddlepaddle==3.3.1's default enable_mkldnn=True raises
# NotImplementedError on CPU (see docs/adr/0001-ocr-runtime-selection.md
# and PaddleOcrEngine's enable_mkldnn=False workaround). An unbounded
# `>=` would let a future install silently drift onto an unverified
# pair. Bumping either version requires re-running
# benchmarks/ocr_runtime_selection/run_benchmark.py and updating the
# ADR/benchmark doc before relaxing this pin.
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    # PaddleOcrEngine._crop_polygon_region (P2 recognition-only path)
    # imports cv2 directly for perspective-warp cropping. Not reliably
    # pulled transitively by paddleocr/paddlepaddle -- declare it as our
    # own direct dependency rather than relying on vendor internals.
    "opencv-python-headless>=4.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"glyphcue.persistence.migrations_sql" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
