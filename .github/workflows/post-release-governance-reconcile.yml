name: Post-release governance reconciliation

on:
  push:
    branches:
      - docs/v1.0.0-post-release-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: docs/v1.0.0-post-release-reconciliation
          fetch-depth: 0

      - name: Apply post-release governance reconciliation
        run: python tools/post_release_governance_reconcile.py

      - name: Validate JSON and changed-file whitespace
        run: |
          python -m json.tool docs/m13_phase_d/phase_d_state.json >/dev/null
          python -m json.tool docs/v1_public_release_dependency_provenance.json >/dev/null
          # DESIGN.md, GLYPHCUE_PRODUCT_ARCHITECTURE.md, and ROADMAP.md intentionally
          # use Markdown two-space hard breaks in their lifecycle header lines.
          git diff --check -- PROJECT_STATUS.md docs/m13_phase_d/PHASE_D_RELAY.md docs/m13_phase_d/phase_d_state.json docs/v1_public_distribution_gate_a_compliance_audit.md docs/v1_public_release_dependency_provenance.json

      - name: Commit reconciled governance state
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No governance changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md GLYPHCUE_PRODUCT_ARCHITECTURE.md PROJECT_STATUS.md ROADMAP.md docs/m13_phase_d/PHASE_D_RELAY.md docs/m13_phase_d/phase_d_state.json docs/v1_public_distribution_gate_a_compliance_audit.md docs/v1_public_release_dependency_provenance.json
          git commit -m "docs(release): reconcile v1.0.0 public release truth"
          git push origin HEAD:docs/v1.0.0-post-release-reconciliation
